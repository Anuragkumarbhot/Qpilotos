name: Reality VFX CI
on:
  push:
    paths:
      - 'reality-vfx/**'
      - '.github/workflows/reality-vfx-ci.yml'
  pull_request:
    paths:
      - 'reality-vfx/**'
      - '.github/workflows/reality-vfx-ci.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reality-vfx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build